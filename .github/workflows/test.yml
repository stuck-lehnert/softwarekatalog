name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      all_artcraft:
        description: Verify real signed installers for all 14 ArtCraft apps
        type: boolean
        default: false
  workflow_call:
    inputs:
      all_artcraft:
        type: boolean
        default: false
  schedule:
    - cron: '17 6 * * 2'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and policy integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Build, encoding, payload and policy resource tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          make dist
        env:
          SOFTKAT_BUILD_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution
          path: dist/setup.ps1
          if-no-files-found: error
          retention-days: 7

  unit:
    name: Unit / ${{ matrix.os }} / ${{ matrix.engine }} / ${{ matrix.architecture }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            engine: powershell
            architecture: x64
            os_architecture: x64
          - os: windows-2022
            engine: pwsh
            architecture: x64
            os_architecture: x64
          - os: windows-2025
            engine: powershell
            architecture: x64
            os_architecture: x64
          - os: windows-2025
            engine: pwsh
            architecture: x64
            os_architecture: x64
          - os: windows-2022
            engine: powershell-x86
            architecture: x86
            os_architecture: x64
          - os: windows-11-arm
            engine: powershell
            architecture: arm64
            os_architecture: arm64
          - os: windows-11-arm
            engine: pwsh
            architecture: arm64
            os_architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run isolated suites and produce JUnit reports
        shell: powershell
        env:
          TEST_ENGINE: ${{ matrix.engine }}
          TEST_ARCH: ${{ matrix.architecture }}
          TEST_OS_ARCH: ${{ matrix.os_architecture }}
        run: |
          $engine = switch ($env:TEST_ENGINE) {
            'powershell-x86' { "$env:SystemRoot\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" }
            'powershell' { "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" }
            'pwsh' { "$env:ProgramFiles\PowerShell\7\pwsh.exe" }
          }
          if (-not (Test-Path -LiteralPath $engine)) { throw "Required test engine is unavailable: $engine" }
          $testArguments = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'tests/Invoke-Tests.ps1', '-ExpectedArchitecture', $env:TEST_ARCH, '-ExpectedOSArchitecture', $env:TEST_OS_ARCH)
          if ($env:TEST_ENGINE -ne 'powershell-x86') { $testArguments += '-RequireNative' }
          New-Item -ItemType Directory -Path test-results -Force | Out-Null
          $exitCode = 1
          try {
            # PS5 otherwise throws on native stderr and discards earlier stdout,
            # including the suite's actionable GitHub error annotations.
            $ErrorActionPreference = 'Continue'
            $output = & $engine @testArguments 2>&1 | Out-String
            $exitCode = $LASTEXITCODE
          } catch { $output = $_ | Out-String } finally { $ErrorActionPreference = 'Stop' }
          $output | Set-Content test-results/engine-launch.log -Encoding UTF8
          Write-Output $output
          if ($exitCode -ne 0) {
            if ($output.Length -gt 12000) { $output = $output.Substring($output.Length - 12000) }
            $detail = $output.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Test engine startup::$detail"
            exit $exitCode
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unit-${{ matrix.os }}-${{ matrix.engine }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14

  system:
    name: SYSTEM integration / ${{ matrix.os }} / ${{ matrix.architecture }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            architecture: x64
          - os: windows-2025
            architecture: x64
          - os: windows-11-arm
            architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution
          path: dist
      - name: Install pinned fixture-building tool
        shell: powershell
        env:
          TEST_ARCH: ${{ matrix.architecture }}
        run: |
          dotnet tool install --tool-path "$env:RUNNER_TEMP\softkat-wix" --arch $env:TEST_ARCH wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real deployment, SYSTEM MSI migration and standard-user security checks
        shell: powershell
        env:
          TEST_ARCH: ${{ matrix.architecture }}
        run: ./tests/Test-WindowsIntegration.ps1 -AllowDisposableMachine -WixPath "$env:RUNNER_TEMP\softkat-wix\wix.exe" -ExpectedArchitecture $env:TEST_ARCH
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: system-${{ matrix.os }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14

  vendor:
    name: ArtCraft vendor trust / ${{ matrix.architecture }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            architecture: x64
          - os: windows-11-arm
            architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read-only real vendor SHA256, Authenticode and native MSI verification as SYSTEM
        shell: powershell
        env:
          TEST_ARCH: ${{ matrix.architecture }}
          ALL_ARTCRAFT: ${{ inputs.all_artcraft || github.event_name == 'schedule' }}
        run: |
          $parameters = @{ ExpectedArchitecture = $env:TEST_ARCH }
          if ($env:ALL_ARTCRAFT -eq 'true') { $parameters.AllPackages = $true }
          ./tests/Test-ArtCraftVendor.ps1 @parameters
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: artcraft-vendor-${{ matrix.architecture }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14

  gate:
    name: CI passed
    if: always()
    needs: [build, unit, system, vendor]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every test layer to pass
        env:
          BUILD: ${{ needs.build.result }}
          UNIT: ${{ needs.unit.result }}
          SYSTEM: ${{ needs.system.result }}
          VENDOR: ${{ needs.vendor.result }}
        run: test "$BUILD" = success && test "$UNIT" = success && test "$SYSTEM" = success && test "$VENDOR" = success
